name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: sme-toolkit-backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff

      - name: Install frontend dependencies
        run: npm ci

      - name: Run backend linting
        working-directory: sme-toolkit-backend
        run: ruff check app/

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Run backend tests
        working-directory: sme-toolkit-backend
        run: pytest tests/ -v --cov=app --cov-report=xml

      - name: Run frontend checks
        run: |
          node scripts/check_demo_session.mjs
          node scripts/check_strategy_modes.mjs

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./sme-toolkit-backend/coverage.xml
          fail_ci_if_error: false

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  build:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./sme-toolkit-backend
          file: ./sme-toolkit-backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Apply K8s manifests
        run: |
          sed -i "s|gemini-api-key: \"\"|gemini-api-key: \"${{ secrets.GEMINI_API_KEY }}\"|" k8s/namespace.yaml
          sed -i "s|jwt-secret-key: \"\"|jwt-secret-key: \"${{ secrets.JWT_SECRET_KEY }}\"|" k8s/namespace.yaml
          kubectl apply -f k8s/ -n sme-toolkit-staging

      - name: Deploy to staging
        run: |
          kubectl set image deployment/sme-toolkit-backend \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }} \
            -n sme-toolkit-staging
          kubectl set image deployment/sme-toolkit-frontend \
            frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }} \
            -n sme-toolkit-staging
          kubectl rollout status deployment/sme-toolkit-backend -n sme-toolkit-staging
          kubectl rollout status deployment/sme-toolkit-frontend -n sme-toolkit-staging

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Apply K8s manifests with secrets
        run: |
          sed -i "s|gemini-api-key: \"\"|gemini-api-key: \"${{ secrets.GEMINI_API_KEY }}\"|" k8s/namespace.yaml
          sed -i "s|groq-api-key: \"\"|groq-api-key: \"${{ secrets.GROQ_API_KEY }}\"|" k8s/namespace.yaml
          sed -i "s|mistral-api-key: \"\"|mistral-api-key: \"${{ secrets.MISTRAL_API_KEY }}\"|" k8s/namespace.yaml
          sed -i "s|deepseek-api-key: \"\"|deepseek-api-key: \"${{ secrets.DEEPSEEK_API_KEY }}\"|" k8s/namespace.yaml
          sed -i "s|replicate-api-key: \"\"|replicate-api-key: \"${{ secrets.REPLICATE_API_KEY }}\"|" k8s/namespace.yaml
          sed -i "s|jwt-secret-key: \"\"|jwt-secret-key: \"${{ secrets.JWT_SECRET_KEY }}\"|" k8s/namespace.yaml
          sed -i "s|encryption-master-key: \"\"|encryption-master-key: \"${{ secrets.ENCRYPTION_MASTER_KEY }}\"|" k8s/namespace.yaml
          sed -i "s|stripe-secret-key: \"\"|stripe-secret-key: \"${{ secrets.STRIPE_SECRET_KEY }}\"|" k8s/namespace.yaml
          kubectl apply -f k8s/ -n sme-toolkit-prod

      - name: Deploy to production
        run: |
          kubectl set image deployment/sme-toolkit-backend \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }} \
            -n sme-toolkit-prod
          kubectl set image deployment/sme-toolkit-frontend \
            frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }} \
            -n sme-toolkit-prod
          kubectl rollout status deployment/sme-toolkit-backend -n sme-toolkit-prod
          kubectl rollout status deployment/sme-toolkit-frontend -n sme-toolkit-prod

      - name: Notify deployment
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-type: application/json' \
            -d '{"text":"SME Toolkit deployed to production: ${{ github.sha }}"}'
