[pytest]
# Pytest configuration for SME Toolkit Backend

# Test discovery
python_files = test_*.py *_test.py
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --cov=app
    --cov-report=html
    --cov-report=term
    --cov-report=xml

# Coverage configuration
[coverage:run]
source = app
omit = 
    */tests/*
    */__init__.py
    */conftest.py
    */migrations/*
    */alembic/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    asyncio: Async tests

# Logging
log_cli = true
log_cli_level = INFO

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test execution
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
