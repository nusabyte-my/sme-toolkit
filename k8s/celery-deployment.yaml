apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: sme-toolkit-prod
  labels:
    app: sme-toolkit
    component: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sme-toolkit
      component: celery-beat
  template:
    metadata:
      labels:
        app: sme-toolkit
        component: celery-beat
    spec:
      containers:
      - name: celery-beat
        image: ghcr.io/nusabyte-my/sme-toolkit/backend:latest
        imagePullPolicy: Always
        command: ["celery", "-A", "app.queue.celery_app", "beat", "--loglevel=info"]
        envFrom:
        - configMapRef:
            name: sme-toolkit-config
        env:
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: sme-toolkit-secrets
              key: redis-url
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
